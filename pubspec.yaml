name: barkada_gallery
description: A private shared group photo gallery for friends.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.0
  cupertino_icons: ^1.0.8
  exif: ^3.3.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  flutter_image_compress: ^2.3.0
  google_sign_in: ^6.2.2
  http: ^1.2.2
  image_gallery_saver_plus: ^4.0.1
  image_picker: ^1.1.2
  intl: ^0.20.1
  path: ^1.9.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
